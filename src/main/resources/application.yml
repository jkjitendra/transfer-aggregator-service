# ============================================
# Transfer Aggregator Service Configuration
# ============================================

server:
  port: 8080

routing:
  osrm:
    enabled: ${ROUTING_ENABLED:false}
    base-url: ${ROUTING_BASE_URL:http://localhost:5000}
    timeout: ${ROUTING_TIMEOUT:2s}


spring:
  application:
    name: transfer-aggregator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/transfer_aggregator}
    username: ${DATABASE_USER:transfer_aggregator}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
  
  # Enable Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true
  
  # Jackson configuration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  
  # Redis configuration for distributed caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  
  # Mail configuration for alerting
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ============================================
# Transfer Aggregator Configuration
# ============================================
transfer:
  aggregator:
    require-live-supplier: ${REQUIRE_LIVE_SUPPLIER:true}
    # Global timeout for all operations (search, book, cancel)
    global-timeout-seconds: 10
    
    # Supplier configurations - enable/disable suppliers here
    suppliers:
      stub:
        enabled: ${STUB_ENABLED:true}
      slow-stub:
        enabled: ${SLOW_STUB_ENABLED:true}
      skyride:
        enabled: ${SKYRIDE_ENABLED:true}
    
    # Resilience configuration
    resilience:
      supplier-timeouts:
        STUB:
          search-seconds: 3
          booking-seconds: 5
          change-seconds: 5
          cancellation-seconds: 5
      # Maximum concurrent supplier calls
      max-concurrent-calls: 50
      # Rate limit per minute for search requests
      search-rate-limit-per-minute: 80
      # Rate limit per minute for poll requests per searchId
      poll-rate-limit-per-minute: 25
    
    # Multi-tenant configuration
    default-tenant: default
    tenants:
      default:
        name: "Default Tenant"
        enabled: true
        # Empty enabled-suppliers = all suppliers allowed
        
      tenant-a:
        name: "Travel Partner A"
        enabled: true
        enabled-suppliers:
          - STUB
        default-currency: USD
        max-results-per-supplier: 10
        
      tenant-b:
        name: "Travel Partner B"
        enabled: true
        enabled-suppliers:
          - SKYRIDE
          - SLOW_STUB
        default-currency: EUR
        
      tenant-premium:
        name: "Premium Partner"
        enabled: true
        enabled-suppliers:
          - STUB
          - SKYRIDE
          - SLOW_STUB
        default-currency: USD
        max-results-per-supplier: 50
    
    # Alerting configuration
    alerting:
      enabled: ${ALERTING_ENABLED:false}
      check-interval-seconds: 60
      
      # DLQ thresholds
      dlq-warning-threshold: 10
      dlq-critical-threshold: 50
      
      # Error rate thresholds (per minute)
      error-rate-warning-threshold: 5
      error-rate-critical-threshold: 20
      
      # Email configuration
      email:
        enabled: ${ALERTING_EMAIL_ENABLED:false}
        from: ${ALERTING_EMAIL_FROM:alerts@arcube.com}
        subject-prefix: "[Arcube Transfer Aggregator]"
        recipients:
          - ${ALERTING_EMAIL_TO:operations@arcube.com}

# Token signing for offerId/bookingId
security:
  api:
    enabled: ${API_SECURITY_ENABLED:true}
    issuer-uri: ${OIDC_ISSUER_URI:}
    audience: ${OIDC_AUDIENCE:}
    tenant-claim: ${OIDC_TENANT_CLAIM:tenant_id}
    roles-claim: ${OIDC_ROLES_CLAIM:roles}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  token:
    # Set from a secret store in authenticated environments; 32+ bytes.
    secret: ${TOKEN_SECRET:}
    active-key-id: ${TOKEN_ACTIVE_KEY_ID:v1}
    previous-keys: {}

workflow:
  encryption-key: ${WORKFLOW_ENCRYPTION_KEY:}
  idempotency-retention-days: ${IDEMPOTENCY_RETENTION_DAYS:7}
  operation-retention-days: ${OPERATION_RETENTION_DAYS:90}
  cancellation-max-attempts: ${CANCELLATION_MAX_ATTEMPTS:3}
  cancellation-lease-seconds: ${CANCELLATION_LEASE_SECONDS:30}

# ============================================
# Resilience4j Circuit Breaker Configuration
# ============================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientException
    instances:
      STUB:
        baseConfig: default
      SKYRIDE:
        baseConfig: default
      SLOW_STUB:
        baseConfig: default
        waitDurationInOpenState: 60s

  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true

# ============================================
# Observability Configuration
# ============================================
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: transfer-aggregator
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.arcube.transferaggregator: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    url: /openapi.yaml
