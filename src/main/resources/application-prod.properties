# Prod runtime configuration. Secrets come from environment variables.
server.port=8080
routing.osrm.enabled=${ROUTING_ENABLED:false}
routing.osrm.base-url=${ROUTING_BASE_URL:http://localhost:5000}
routing.osrm.timeout=${ROUTING_TIMEOUT:2s}
spring.application.name=transfer-aggregator
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
spring.jackson2.default-property-inclusion=non_null
spring.jackson2.deserialization.fail-on-unknown-properties=false
spring.jackson2.serialization.write-dates-as-timestamps=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
transfer.aggregator.require-live-supplier=true
transfer.aggregator.global-timeout-seconds=10
transfer.aggregator.suppliers.stub.enabled=false
transfer.aggregator.suppliers.slow-stub.enabled=false
transfer.aggregator.suppliers.skyride.enabled=false
transfer.aggregator.resilience.max-concurrent-calls=50
transfer.aggregator.resilience.search-rate-limit-per-minute=80
transfer.aggregator.resilience.poll-rate-limit-per-minute=25
transfer.aggregator.default-tenant=default
transfer.aggregator.tenants.default.name=Default Tenant
transfer.aggregator.tenants.default.enabled=${DEFAULT_TENANT_ENABLED:false}
transfer.aggregator.alerting.enabled=${ALERTING_ENABLED:false}
transfer.aggregator.alerting.check-interval-seconds=60
transfer.aggregator.alerting.dlq-warning-threshold=10
transfer.aggregator.alerting.dlq-critical-threshold=50
transfer.aggregator.alerting.error-rate-warning-threshold=5
transfer.aggregator.alerting.error-rate-critical-threshold=20
transfer.aggregator.alerting.email.enabled=${ALERTING_EMAIL_ENABLED:false}
transfer.aggregator.alerting.email.from=${ALERTING_EMAIL_FROM:alerts@arcube.com}
transfer.aggregator.alerting.email.subject-prefix=[Arcube Transfer Aggregator]
transfer.aggregator.alerting.email.recipients[0]=${ALERTING_EMAIL_TO:operations@arcube.com}
security.api.enabled=true
security.api.issuer-uri=${OIDC_ISSUER_URI}
security.api.jwk-set-uri=${OIDC_JWK_SET_URI:}
security.api.audience=${OIDC_AUDIENCE}
security.api.tenant-claim=${OIDC_TENANT_CLAIM:tenant_id}
security.api.roles-claim=${OIDC_ROLES_CLAIM:roles}
security.api.allowed-origins=${CORS_ALLOWED_ORIGINS:}
security.token.secret=${TOKEN_SECRET}
security.token.active-key-id=${TOKEN_ACTIVE_KEY_ID:v1}
workflow.encryption-key=${WORKFLOW_ENCRYPTION_KEY}
workflow.idempotency-retention-days=${IDEMPOTENCY_RETENTION_DAYS:7}
workflow.operation-retention-days=${OPERATION_RETENTION_DAYS:90}
workflow.cancellation-max-attempts=${CANCELLATION_MAX_ATTEMPTS:3}
workflow.cancellation-lease-seconds=${CANCELLATION_LEASE_SECONDS:30}
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.recordExceptions[0]=java.io.IOException
resilience4j.circuitbreaker.configs.default.recordExceptions[1]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.configs.default.recordExceptions[2]=org.springframework.web.reactive.function.client.WebClientException
resilience4j.timelimiter.configs.default.timeoutDuration=10s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
management.tracing.sampling.probability=${TRACE_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${ALERTING_EMAIL_ENABLED:false}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.metrics.tags.application=transfer-aggregator
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.level.root=INFO
logging.level.com.arcube.transferaggregator=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.url=/openapi.yaml
visual.grafana-base-url=${GRAFANA_BASE_URL:}
