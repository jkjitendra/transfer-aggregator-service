openapi: 3.0.3
info:
  title: Airport Transfer Aggregator API
  description: |
    REST API for aggregating airport transfer services from multiple suppliers.

    ## Features
    - Search across multiple suppliers in parallel
    - Unified booking interface
    - Signed, stateless tokens for offers and bookings
    - PostgreSQL-backed idempotency and operation status for authenticated write requests
    - Optional read-only route estimates from OSRM; these do not create bookings

    ## Authentication
    Business and admin requests require an OIDC bearer JWT with the configured issuer and audience.
    The roles claim supports CUSTOMER, SUPPORT, and OPERATOR. Business requests also require an
    enabled tenant claim. X-Tenant-Id is optional and must match the JWT tenant when supplied.
    Customer and operator roles can write business requests; support can read. Support and operator
    can read admin alerts; only operator can trigger checks. Simulation routes exist only in the demo profile.

    ## Rate Limits
    - Search: 80 permits/minute per supplier; Redis-backed across replicas outside demo
    - Poll: 25 requests/minute per search ID; Redis-backed across replicas outside demo
    - Booking: no dedicated request rate limit
  version: 1.0.0
  contact:
    name: Arcube Engineering
    email: engineering@arcube.com

servers:
  - url: http://localhost:8080
    description: Local server (demo profile or authenticated configuration)

security:
  - bearerAuth: []

tags:
  - name: Transfers
    description: Airport transfer search, booking, cancellation, polling
  - name: Pricing
    description: Pricing operations and amenities pricing
  - name: BookingChanges
    description: Search and commit booking changes
  - name: AdminAlerts
    description: Admin endpoints for alerting and monitoring
  - name: Routes
    description: Optional driving distance and duration estimates

paths:
  /api/v1/routes/estimate:
    get:
      tags: [Routes]
      summary: Estimate a driving route
      description: Available when routing.osrm.enabled is true. Public demo routing is restricted to the demo profile; production should use a self-hosted OSRM instance.
      operationId: estimateRoute
      parameters:
        - name: pickupLatitude
          in: query
          required: true
          schema: {type: number, format: double, minimum: -90, maximum: 90}
        - name: pickupLongitude
          in: query
          required: true
          schema: {type: number, format: double, minimum: -180, maximum: 180}
        - name: dropoffLatitude
          in: query
          required: true
          schema: {type: number, format: double, minimum: -90, maximum: 90}
        - name: dropoffLongitude
          in: query
          required: true
          schema: {type: number, format: double, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Driving route estimate
          content:
            application/json:
              schema:
                type: object
                required: [distanceMeters, durationSeconds, attribution]
                properties:
                  distanceMeters: {type: integer, format: int64}
                  durationSeconds: {type: integer, format: int64}
                  attribution: {type: string}
        '400': {description: Invalid coordinates}
        '404': {description: No driving route found}
        '429': {description: Public demo rate limit exceeded}
        '503': {description: Routing backend unavailable}
  /api/v1/transfers/search:
    post:
      tags:
        - Transfers
      summary: Search for transfer offers
      description: Searches all enabled suppliers for transfer offers matching the criteria
      operationId: search
      parameters:
        - name: X-Request-Id
          in: header
          description: Request ID for tracing
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              pickupLocation:
                address: "433 Park Ave, New York, NY"
              dropoffLocation:
                iataCode: "JFK"
              pickupDateTime: "2024-08-16T15:30:00"
              numPassengers: 2
              numBags: 2
              currency: "USD"
              mode: "ONE_WAY"
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/search/{searchId}/poll:
    get:
      tags:
        - Transfers
      summary: Poll for search results (with filtering/sorting/pagination)
      description: |
        Poll search results for a given searchId.
        Supports filtering, sorting, and pagination via query params.
        Incomplete aggregate search state is stored in Redis for 10 minutes.
        Unknown IDs return 404; recently expired IDs return 410. Redis failure returns 503.
      operationId: pollSearch
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string

        - name: searchId
          in: path
          required: true
          schema:
            type: string

        # Pagination
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200

        # Sorting
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: PRICE
            description: Sort field. If invalid, server falls back to PRICE.
        - name: sortDir
          in: query
          required: false
          schema:
            type: string
            default: ASC
            description: Sort direction. If invalid, server falls back to ASC.

        # Price filters
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number

        # Vehicle filters
        - name: vehicleTypes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: vehicleClasses
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: vehicleCategories
          in: query
          required: false
          schema:
            type: array
            items:
              type: string

        # Capacity filters
        - name: minPassengers
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: minBags
          in: query
          required: false
          schema:
            type: integer
            minimum: 0

        # Amenity filters + cancellation
        - name: amenities
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Required amenities
        - name: freeCancellationOnly
          in: query
          required: false
          schema:
            type: boolean

        # Provider filters
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: providers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string

        # Duration filter
        - name: maxDuration
          in: query
          required: false
          schema:
            type: integer
            minimum: 1

      responses:
        '200':
          description: Search results (possibly partial if suppliers still running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid searchId or invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Search ID not found
        '410':
          description: Search results expired
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/book:
    post:
      tags:
        - Transfers
      summary: Book a transfer
      description: |
        Books a transfer using an offer ID from a previous search.
        Authenticated deployments require Idempotency-Key. PostgreSQL atomically claims the
        tenant, operation type, and key for seven days. Reuse with a different request is 409.
        A crash or ambiguous supplier result is UNKNOWN_OUTCOME and requires review.
        The demo profile retains a local response cache.
      operationId: book
      parameters:
        - name: X-Request-Id
          in: header
          description: Request ID for tracing
          required: false
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Required outside demo; unique per intended booking request.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
            example:
              offerId: "eyJpYXQiOjE3NjgwNTM4MzkuLi4"
              passenger:
                firstName: "John"
                lastName: "Doe"
                email: "john.doe@example.com"
                phoneNumber: "+1234567890"
                countryCode: "US"
              flight:
                airline: "AA"
                flightNumber: "123"
      responses:
        '200':
          description: Terminal booking result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '202':
          description: Pending or unknown supplier outcome; inspect operationId before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '409':
          description: Idempotency-Key reused with a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier code from the signed offer is not registered or enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Offer expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/bookings/{bookingId}:
    delete:
      tags:
        - Transfers
      summary: Cancel a booking
      description: Outside demo, persists a cancellation job before returning 202. A leased worker processes it; ambiguous outcomes without verified safe retry enter manual review. Demo retains the local queue.
      operationId: cancel
      parameters:
        - name: X-Request-Id
          in: header
          description: Request ID for tracing
          required: false
          schema:
            type: string
        - name: bookingId
          in: path
          description: The booking ID to cancel
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Terminal cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '202':
          description: Cancellation accepted for durable processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Invalid booking ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier code from the signed booking ID is not registered or enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cancellation window has passed; already-cancelled supplier responses return 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/bookings/{bookingId}/cancel-status:
    get:
      tags:
        - Transfers
      summary: Get cancellation status
      description: Outside demo, returns durable pending, succeeded, DLQ, unknown-outcome, or resolved state. Demo uses the local queue.
      operationId: getCancelStatus
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '404':
          description: No cancellation request exists for this booking and tenant

  /api/v1/pricing:
    post:
      tags:
        - Pricing
      summary: Calculate total price for an offer with selected amenities
      operationId: calculatePrice
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
      responses:
        '200':
          description: Pricing calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Offer/Search not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Offer expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Pricing
      summary: Get price with amenities via query params
      description: GET support for selected amenities.
      operationId: getPriceWithAmenities
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: searchId
          in: query
          required: true
          schema:
            type: string
        - name: offerId
          in: query
          required: true
          schema:
            type: string
        - name: amenities
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Pricing calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Offer/Search not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Offer expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/pricing/{offerId}/amenities:
    get:
      tags:
        - Pricing
      summary: Get list of available amenities for an offer
      operationId: getAvailableAmenities
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Amenities returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmenityInfo'
        '400':
          description: Invalid offerId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Offer expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/bookings/{bookingId}/search-changes:
    post:
      tags:
        - BookingChanges
      summary: Search for alternative offers to change an existing booking
      operationId: searchBookingChanges
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingChangeSearchRequest'
      responses:
        '200':
          description: Change search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid bookingId or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier code from the signed booking ID is not registered or enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/bookings/{bookingId}/commit-change:
    post:
      tags:
        - BookingChanges
      summary: Commit a supplier-supported booking change
      description: Only adapters implementing ReservationChangeSupplier can commit. Authenticated deployments require an atomic PostgreSQL Idempotency-Key claim; ambiguous outcomes are held for review.
      operationId: commitBookingChange
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Required outside demo for a supplier-supported change.
          required: true
          schema:
            type: string
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingChangeCommitRequest'
      responses:
        '200':
          description: Terminal change result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingChangeResponse'
        '202':
          description: Pending or unknown supplier outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingChangeResponse'
        '409':
          description: Idempotency-Key reused with a different change request
        '400':
          description: Invalid bookingId or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier code from the signed booking ID is not registered or enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Offer expired / change window expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/{operationId}:
    get:
      tags: [Transfers]
      summary: Get a tenant-owned durable operation status
      description: Available outside demo for booking, change, and cancellation operations. Does not expose stored passenger data.
      operationId: getOperationStatus
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current durable operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '404':
          description: Operation not found for this tenant

  /api/v1/admin/operations/review:
    get:
      tags: [AdminAlerts]
      summary: List ambiguous operations requiring review
      operationId: listOperationsForReview
      responses:
        '200':
          description: Sanitized operation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationView'

  /api/v1/operations/{operationId}/timeline:
    get:
      tags: [Transfers]
      summary: View sanitized timeline for a tenant-owned operation
      description: Returns at most 100 durable events. Trace IDs may be absent when no span was sampled.
      operationId: getOperationTimeline
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ordered operation events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OperationAuditEvent'}
        '404':
          description: Operation not found for this tenant

  /api/v1/admin/operations/{operationId}/timeline:
    get:
      tags: [AdminAlerts]
      summary: View sanitized timeline for an operation under support review
      operationId: getAdminOperationTimeline
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ordered operation events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OperationAuditEvent'}
        '404':
          description: Operation not found

  /api/v1/admin/operations/{operationId}/review:
    post:
      tags: [AdminAlerts]
      summary: Record an evidence-backed manual review decision
      description: Operator role required. Only FAILED or MANUAL_REVIEW decisions are accepted; confirmed bookings require supplier verification before a later reconciliation workflow can mark success.
      operationId: reviewOperation
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Decision recorded with an audit event
        '409':
          description: Operation is not reviewable

  /api/v1/admin/cancellations/dlq:
    get:
      tags: [AdminAlerts]
      summary: List real cancellation dead letters
      description: Support or operator role required; returns sanitized PostgreSQL-backed records.
      operationId: listCancellationDeadLetters
      responses:
        '200':
          description: Active dead letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadLetterView'

  /api/v1/admin/cancellations/dlq/{jobId}/replay:
    post:
      tags: [AdminAlerts]
      summary: Replay a dead letter only when supplier cancellation retry is verified safe
      operationId: replayCancellationDeadLetter
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '202':
          description: Replay scheduled and audited
        '409':
          description: Dead letter is not replayable

  /api/v1/admin/cancellations/dlq/{jobId}/resolve:
    post:
      tags: [AdminAlerts]
      summary: Mark a dead letter or unknown cancellation outcome reviewed
      operationId: resolveCancellationDeadLetter
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Resolution recorded and audited
        '409':
          description: Job is not resolvable

  /api/v1/admin/alerts/dlq:
    get:
      tags:
        - AdminAlerts
      summary: Get cancellation DLQ size and alert threshold status
      description: SUPPORT or OPERATOR. Reads PostgreSQL dead letters outside demo; reads a simulated counter in demo.
      operationId: getDlqStatus
      responses:
        '200':
          description: DLQ status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStatus'
    delete:
      tags:
        - AdminAlerts
      summary: Clear simulated DLQ counter
      description: Demo profile only. Resets the ErrorMetrics counter; cancellation DLQ items are not removed.
      operationId: clearDlq
      responses:
        '200':
          description: Simulated DLQ counter cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqClearResponse'

  /api/v1/admin/alerts/errors:
    get:
      tags:
        - AdminAlerts
      summary: Get error metrics summary
      operationId: getErrorMetrics
      responses:
        '200':
          description: Error metrics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMetricsResponse'

  /api/v1/admin/alerts/dlq/simulate:
    post:
      tags:
        - AdminAlerts
      summary: Simulate adding items to DLQ
      description: Demo profile only. Increments a simulated metric counter; it does not create CancellationDLQ items.
      operationId: simulateDlqItems
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: DLQ items simulated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqSimulateResponse'

  /api/v1/admin/alerts/check:
    post:
      tags:
        - AdminAlerts
      summary: Manually trigger alerting check
      operationId: triggerAlertCheck
      responses:
        '200':
          description: Alerting check executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerCheckResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OperationView:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        tenantId:
          type: string
        kind:
          type: string
          enum: [BOOKING, CHANGE, CANCELLATION]
        state:
          type: string
          enum: [IN_PROGRESS, CONFIRMED, FAILED, UNKNOWN_OUTCOME, MANUAL_REVIEW, REQUESTED, RETRY_SCHEDULED, SUCCEEDED, DLQ, RESOLVED]
        supplierCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OperationAuditEvent:
      type: object
      properties:
        action:
          type: string
        detailCode:
          type: string
          description: Allowlisted state or reason code; other details are redacted.
        traceId:
          type: string
          nullable: true
          description: Sampled W3C trace identifier for finding the trace waterfall.
        requestId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DeadLetterView:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        tenantId:
          type: string
        supplierCode:
          type: string
        attempts:
          type: integer
        reasonCode:
          type: string
        createdAt:
          type: string
          format: date-time
        replayCount:
          type: integer

    AdminActionRequest:
      type: object
      required: [evidenceReference]
      properties:
        evidenceReference:
          type: string
          description: External support or supplier ticket reference; do not place customer data here.
          minLength: 4
          maxLength: 128
        decision:
          type: string
          enum: [FAILED, MANUAL_REVIEW]

    SearchRequest:
      type: object
      required:
        - pickupLocation
        - dropoffLocation
      properties:
        pickupLocation:
          $ref: '#/components/schemas/LocationDto'
        dropoffLocation:
          $ref: '#/components/schemas/LocationDto'
        pickupDateTime:
          type: string
          format: date-time
          description: Optional. Pickup date and time in ISO 8601 format. If omitted, suppliers may return generic/estimated offers.
        numPassengers:
          type: integer
          minimum: 1
          default: 1
          description: Number of passengers
        numBags:
          type: integer
          minimum: 0
          default: 0
          description: Number of bags
        currency:
          type: string
          default: "USD"
          description: Currency code (ISO 4217)
        mode:
          type: string
          enum: [ONE_WAY, ROUND_TRIP, HOURLY]
          default: ONE_WAY
          description: Transfer mode

    LocationDto:
      type: object
      description: Location can be specified by address, IATA code, coordinates, or place ID
      properties:
        address:
          type: string
          description: Full address
        iataCode:
          type: string
          description: Airport IATA code (e.g., JFK, LAX)
        placeId:
          type: string
          description: Google Place ID
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    BookRequest:
      type: object
      required:
        - offerId
        - passenger
      properties:
        offerId:
          type: string
          description: Signed offer ID from search results
        passenger:
          $ref: '#/components/schemas/PassengerDto'
        flight:
          $ref: '#/components/schemas/FlightDto'
        extraPassengers:
          type: array
          items:
            $ref: '#/components/schemas/ExtraPassengerDto'
        specialInstructions:
          type: string
          description: Special instructions for the driver

    PassengerDto:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - countryCode
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code

    FlightDto:
      type: object
      required:
        - airline
        - flightNumber
      properties:
        airline:
          type: string
          description: Airline IATA code (e.g., AA, UA)
        flightNumber:
          type: string

    ExtraPassengerDto:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
        lastName:
          type: string

    SearchResponse:
      type: object
      properties:
        searchId:
          type: string
          description: Unique search identifier
        offers:
          type: array
          items:
            $ref: '#/components/schemas/OfferDto'
        incomplete:
          type: boolean
          description: True if a supplier timed out, errored, was skipped by an open circuit, or still needs polling
        supplierStatuses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SupplierStatusDto'

    OfferDto:
      type: object
      properties:
        offerId:
          type: string
          description: Signed offer ID (use this for booking)
        supplierCode:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        provider:
          $ref: '#/components/schemas/Provider'
        totalPrice:
          $ref: '#/components/schemas/Money'
        cancellation:
          $ref: '#/components/schemas/CancellationPolicy'
        estimatedDurationMinutes:
          type: integer
        flightInfoRequired:
          type: boolean
        extraPassengerInfoRequired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        includedAmenities:
          type: array
          items:
            type: string
        availableAmenities:
          type: array
          items:
            $ref: '#/components/schemas/AmenityDto'

    Vehicle:
      type: object
      properties:
        type:
          type: string
        category:
          type: string
        vehicleClass:
          type: string
        image:
          type: string
        maxPassengers:
          type: integer
        maxBags:
          type: integer
        make:
          type: string
        model:
          type: string

    Provider:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
        rating:
          type: number
        ratingCount:
          type: integer
        contactPhone:
          type: string

    Money:
      type: object
      properties:
        value:
          type: number
        currency:
          type: string
        display:
          type: string

    CancellationPolicy:
      type: object
      properties:
        cancellableOnline:
          type: boolean
        cancellableOffline:
          type: boolean
        amendable:
          type: boolean
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CancellationTier'
        fullyRefundable:
          type: boolean

    CancellationTier:
      type: object
      properties:
        hoursNotice:
          type: integer
        refundPercent:
          type: integer

    AmenityDto:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'

    SupplierStatusDto:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCESS, POLLING, ERROR, TIMEOUT, CIRCUIT_OPEN]
        resultsCount:
          type: integer
        errorMessage:
          type: string

    BookResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        bookingId:
          type: string
          description: Signed booking ID
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED, CANCELLED, PRICE_CHANGED, UNKNOWN_OUTCOME]
        confirmationNumber:
          type: string
        totalPrice:
          $ref: '#/components/schemas/Money'
        pickupInstructions:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderContactDto'
        errorCode:
          type: string
        errorMessage:
          type: string
        suggestedAction:
          type: string

    ProviderContactDto:
      type: object
      properties:
        name:
          type: string
        contactPhone:
          type: string

    CancelResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        bookingId:
          type: string
        status:
          type: string
          enum: [PENDING, FAILED, CANCELLED, UNKNOWN, UNKNOWN_OUTCOME, RESOLVED]
        refundAmount:
          $ref: '#/components/schemas/Money'
        refundedAt:
          type: string
          format: date-time
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        suggestedAction:
          type: string
          description: Suggested action (e.g., RETRY, RE_SEARCH)
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    PricingRequest:
      type: object
      required:
        - searchId
        - offerId
      properties:
        searchId:
          type: string
        offerId:
          type: string
          description: Signed offer ID (from search results)
        amenities:
          type: array
          items:
            type: string
          description: Selected amenity keys

    PricingResponse:
      type: object
      properties:
        searchId:
          type: string
        offerId:
          type: string
        basePrice:
          $ref: '#/components/schemas/Money'
        selectedAmenities:
          type: array
          items:
            $ref: '#/components/schemas/SelectedAmenity'
        totalPrice:
          $ref: '#/components/schemas/Money'
        message:
          type: string

    SelectedAmenity:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'

    AmenityInfo:
      type: object
      description: Amenity metadata returned by PricingService#getAvailableAmenities
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'

    BookingChangeSearchRequest:
      type: object
      description: |
        Request to search alternative offers for an existing booking.
        bookingId is set server-side from the path variable.
      properties:
        bookingId:
          type: string
          readOnly: true
        pickupLocation:
          $ref: '#/components/schemas/LocationDto'
        dropoffLocation:
          $ref: '#/components/schemas/LocationDto'
        pickupDateTime:
          type: string
          format: date-time
        numPassengers:
          type: integer
          minimum: 1
        numBags:
          type: integer
          minimum: 0
        currency:
          type: string
        mode:
          type: string
          enum: [ONE_WAY, ROUND_TRIP, HOURLY]

    BookingChangeCommitRequest:
      type: object
      required:
        - resultId
      properties:
        oldBookingId:
          type: string
          readOnly: true
        resultId:
          type: string
          description: Identifier of the selected new option from search-changes results

    BookingChangeResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        oldBookingId:
          type: string
        newBookingId:
          type: string
        status:
          type: string
          enum: [SUCCESS, PENDING, FAILED, UNKNOWN_OUTCOME]
        newConfirmationNumber:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string

    AlertStatus:
      type: object
      description: PostgreSQL cancellation DLQ size outside demo; simulated ErrorMetrics counter in demo
      properties:
        level:
          type: string
          enum: [OK, WARNING, CRITICAL]
        currentValue:
          type: integer
        warningThreshold:
          type: integer
        criticalThreshold:
          type: integer

    ErrorMetricsResponse:
      type: object
      properties:
        searchErrors:
          type: integer
        bookingErrors:
          type: integer
        cancellationErrors:
          type: integer
        totalDlqSize:
          type: integer

    DlqSimulateResponse:
      type: object
      properties:
        added:
          type: integer
        newSize:
          type: integer

    DlqClearResponse:
      type: object
      properties:
        cleared:
          type: integer
        newSize:
          type: integer

    TriggerCheckResponse:
      type: object
      properties:
        status:
          type: string
        dlqStatus:
          $ref: '#/components/schemas/AlertStatus'
