security:
  api:
    enabled: true

transfer:
  aggregator:
    suppliers:
      stub:
        enabled: false
      slow-stub:
        enabled: false
      skyride:
        enabled: false

logging:
  level:
    com.arcube.transferaggregator: INFO
management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
