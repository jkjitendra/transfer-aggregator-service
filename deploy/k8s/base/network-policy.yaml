apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transfer-aggregator-ingress
spec:
  podSelector:
    matchLabels:
      app: transfer-aggregator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              transfer-aggregator-client: "true"
      ports:
        - protocol: TCP
          port: 8080
