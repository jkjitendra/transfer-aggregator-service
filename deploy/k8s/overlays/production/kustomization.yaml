apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: transfer-production
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      kind: Deployment
      name: transfer-aggregator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: transfer-aggregator
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
